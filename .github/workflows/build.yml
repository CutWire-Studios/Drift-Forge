name: build

on:
  push:
  pull_request:

env:
  IMAGE: ghcr.io/cutwire-studios/drift-forge

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - name: glslang (shader validation)
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check-shaders
      - run: npx vite build

  image:
    needs: test
    # Forks can't push to the registry; an image nobody can pull is wasted minutes.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dispatch-deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # The body goes in on stdin because client_payload must arrive as a JSON object.
      - name: Trigger cutwire-ansible
        env:
          GH_TOKEN: ${{ secrets.ANSIBLE_DISPATCH_TOKEN }}
        run: |
          jq -nc \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF_NAME" \
            '{event_type:"deploy-forge", client_payload:{sha:$sha, ref:$ref}}' \
          | gh api --method POST repos/cutwire-studios/cutwire-ansible/dispatches --input -
